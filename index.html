<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    <div id="toolbar">
      <input type="file" id="fileInput" accept="audio/*" hidden>
      <button id="loadBtn">📂 Load</button>
      <button id="playBtn" disabled>▶ Play</button>
      <div class="separator"></div>
      <button class="mode-btn active" data-mode="bars">Bars</button>
      <button class="mode-btn" data-mode="circular">Circular</button>
      <button class="mode-btn" data-mode="waveform">Waveform</button>
      <button class="mode-btn" data-mode="particles">Particles</button>
      <div class="separator"></div>
      <button class="theme-btn active" data-theme="neon">Neon</button>
      <button class="theme-btn" data-theme="sunset">Sunset</button>
      <button class="theme-btn" data-theme="ocean">Ocean</button>
      <button class="theme-btn" data-theme="monochrome">Mono</button>
      <div class="separator"></div>
      <button id="fullscreenBtn">⛶</button>
      <span id="fileName"></span>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
